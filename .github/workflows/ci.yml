name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check domain-helper.js
          node --check ui/app.js
      - name: Test managed entities
        run: node tests/domain-helper.test.js
      - name: Validate Community Apps package
        run: node tests/submission.test.js
